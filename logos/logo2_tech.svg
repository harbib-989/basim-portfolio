<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- خيار 2: تقني - شبكة عقد متصلة -->
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E27"/>
      <stop offset="100%" stop-color="#1F2747"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#2E75B6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00D9FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg2)"/>

  <!-- شبكة نقاط في الخلفية -->
  <g opacity="0.08" fill="#00D9FF">
    <circle cx="100" cy="100" r="2"/><circle cx="200" cy="100" r="2"/><circle cx="300" cy="100" r="2"/>
    <circle cx="100" cy="200" r="2"/><circle cx="200" cy="200" r="2"/><circle cx="300" cy="200" r="2"/>
    <circle cx="780" cy="900" r="2"/><circle cx="880" cy="900" r="2"/><circle cx="980" cy="900" r="2"/>
    <circle cx="780" cy="800" r="2"/><circle cx="880" cy="800" r="2"/><circle cx="980" cy="800" r="2"/>
  </g>

  <!-- الشعار: شكل سداسي مع عقد متصلة -->
  <g transform="translate(540, 420)">
    <!-- توهج -->
    <circle cx="0" cy="0" r="250" fill="url(#glow)"/>

    <!-- شكل سداسي خارجي -->
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80" fill="none" stroke="url(#neon)" stroke-width="6"/>

    <!-- خطوط اتصال داخلية -->
    <g stroke="#00D9FF" stroke-width="2" opacity="0.6">
      <line x1="0" y1="-160" x2="0" y2="160"/>
      <line x1="-138" y1="-80" x2="138" y2="80"/>
      <line x1="138" y1="-80" x2="-138" y2="80"/>
    </g>

    <!-- العقد (Nodes) -->
    <g fill="#00D9FF">
      <circle cx="0" cy="-160" r="14"/>
      <circle cx="138" cy="-80" r="14"/>
      <circle cx="138" cy="80" r="14"/>
      <circle cx="0" cy="160" r="14"/>
      <circle cx="-138" cy="80" r="14"/>
      <circle cx="-138" cy="-80" r="14"/>
    </g>

    <!-- مركز ذهبي -->
    <circle cx="0" cy="0" r="32" fill="#F1C232"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#FFFFFF" stroke-width="3"/>

    <!-- أقواس -->
    <g fill="#0A0E27" font-family="monospace" font-size="22" font-weight="bold" text-anchor="middle">
      <text x="0" y="8">&lt;/&gt;</text>
    </g>
  </g>

  <!-- النص العربي -->
  <text x="540" y="730" font-family="Arial, sans-serif" font-size="96" font-weight="bold" text-anchor="middle" fill="#FFFFFF">حلول رقمية</text>

  <!-- خط نيون فاصل -->
  <rect x="380" y="760" width="320" height="2" fill="url(#neon)"/>
  <circle cx="540" cy="761" r="6" fill="#00D9FF"/>

  <!-- النص الإنجليزي -->
  <text x="540" y="820" font-family="Courier New, monospace" font-size="38" font-weight="700" text-anchor="middle" fill="#00D9FF" letter-spacing="8">DIGITAL_SOLUTIONS</text>

  <!-- شريط سفلي -->
  <text x="540" y="900" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" fill="#FFFFFF" opacity="0.6">Web • Apps • Systems • Automation</text>
</svg>
