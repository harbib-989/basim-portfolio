<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <!-- خيار 3: خط عربي أنيق - أزرق ملكي + ذهبي -->
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#E8F0FE"/>
    </linearGradient>
    <linearGradient id="goldgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A017"/>
      <stop offset="50%" stop-color="#F1C232"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="bluegrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B5394"/>
      <stop offset="100%" stop-color="#1F4E79"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg3)"/>

  <!-- زخارف هندسية إسلامية في الزوايا -->
  <g opacity="0.08" stroke="#0B5394" stroke-width="2" fill="none">
    <!-- نجمة ثمانية أعلى يسار -->
    <g transform="translate(120, 120)">
      <polygon points="0,-50 14,-14 50,0 14,14 0,50 -14,14 -50,0 -14,-14"/>
    </g>
    <!-- نجمة ثمانية أسفل يمين -->
    <g transform="translate(960, 960)">
      <polygon points="0,-50 14,-14 50,0 14,14 0,50 -14,14 -50,0 -14,-14"/>
    </g>
  </g>

  <!-- دائرة الشعار الرئيسية -->
  <g transform="translate(540, 380)">
    <!-- دائرة خارجية ذهبية -->
    <circle cx="0" cy="0" r="200" fill="none" stroke="url(#goldgrad)" stroke-width="8"/>
    <!-- دائرة داخلية أزرق -->
    <circle cx="0" cy="0" r="175" fill="url(#bluegrad)"/>
    <!-- زخرفة دائرية -->
    <circle cx="0" cy="0" r="155" fill="none" stroke="#F1C232" stroke-width="2" opacity="0.5" stroke-dasharray="4,8"/>

    <!-- حرف "ح" منحوت بأسلوب الخط الديواني -->
    <g fill="#F1C232" transform="translate(0, 15)">
      <!-- جسم الحاء -->
      <path d="M -100 -20
               Q -100 -90 -30 -90
               L 70 -90
               Q 110 -90 110 -50
               L 110 30
               Q 110 80 60 80
               L -50 80
               Q -110 80 -110 30
               Q -110 -20 -60 -20 Z"
            fill="none" stroke="#F1C232" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- نقطة الحاء (داخل) -->
      <circle cx="20" cy="-20" r="10" fill="#F1C232"/>
    </g>

    <!-- نجمة صغيرة -->
    <g fill="#F1C232" transform="translate(110, -110)">
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3"/>
    </g>
  </g>

  <!-- خط عربي مزخرف "IrtiqaTech" -->
  <text x="540" y="690" font-family="Arial, sans-serif" font-size="110" font-weight="900" text-anchor="middle" fill="url(#bluegrad)" letter-spacing="-2">IrtiqaTech</text>

  <!-- خط فاصل ذهبي -->
  <g transform="translate(540, 730)">
    <line x1="-180" y1="0" x2="-30" y2="0" stroke="url(#goldgrad)" stroke-width="3"/>
    <polygon points="-20,-8 -5,0 -20,8" fill="#F1C232"/>
    <polygon points="20,-8 5,0 20,8" fill="#F1C232"/>
    <line x1="30" y1="0" x2="180" y2="0" stroke="url(#goldgrad)" stroke-width="3"/>
  </g>

  <!-- النص الإنجليزي -->
  <text x="540" y="800" font-family="Georgia, serif" font-size="46" font-style="italic" font-weight="600" text-anchor="middle" fill="#0B5394" letter-spacing="8">Digital Solutions</text>

  <!-- شريط سفلي -->
  <text x="540" y="880" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#1F4E79" opacity="0.8">صناعة سعودية • جودة عالمية</text>

  <!-- شعار صغير سفلي -->
  <text x="540" y="950" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#0B5394" opacity="0.5" letter-spacing="4">EST. 2026</text>
</svg>
